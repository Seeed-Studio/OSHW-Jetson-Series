name: bazaar-sync

on:
  schedule:
    - cron: "0 2 * * 1"   # 每周一 02:00 UTC
  workflow_dispatch:      # 也可手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare toolchain (inline, no repo script)
        run: |
          python3 - <<'PY'
          import base64, pathlib
          pathlib.Path('/tmp/sync_bazaar.py').write_bytes(base64.b64decode(''))
          pathlib.Path('/tmp/products.tsv').write_bytes(base64.b64decode(''))
          PY

      - name: Run sync_bazaar
        run: python3 /tmp/sync_bazaar.py --repo . --products /tmp/products.tsv

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':(exclude)Resources/'
          if git diff --cached --quiet; then
            echo "No changes from this sync"
            exit 0
          fi
          git commit -m "bazaar: sync certificates & resources [skip ci]"
          git push origin HEAD:main
