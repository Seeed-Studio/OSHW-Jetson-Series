name: bazaar-sync

on:
  schedule:
    - cron: "0 2 * * 1"   # 每周一 02:00 UTC
  workflow_dispatch:      # 也可手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync_bazaar
        run: python3 scripts/sync_bazaar.py --repo . --products scripts/products.tsv

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes from this sync"
            exit 0
          fi
          git commit -m "bazaar: sync certificates & resources [skip ci]"
          git push origin HEAD:main